<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">使い方ガイド — 献立カート</title>
  <link rel="icon" href="./icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #1C1C1E;
      background: #F2F2F7;
      line-height: 1.7;
    }

    /* ヘッダー */
    header {
      background: #FFFFFF;
      text-align: center;
      padding: 48px 20px 36px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      background: #E8692A;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(232,105,42,0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #1C1C1E;
    }

    .tagline {
      font-size: 14px;
      color: #8E8E93;
      margin-top: 6px;
    }

    /* 訳が無い言語では .step-hint を辞書側で空にしている。空の行が余白だけ残らないようにする */
    .step-hint:empty { display: none; }

    /* セクション */
    .content {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .guide-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #8E8E93;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 4px;
    }

    .section-desc {
      font-size: 14px;
      color: #8E8E93;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* ステップ */
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #F2F2F7;
    }

    .step:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .step-num {
      width: 28px;
      height: 28px;
      background: #E8692A;
      color: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 15px;
      color: #1C1C1E;
      line-height: 1.6;
    }

    .step-text strong {
      font-weight: 700;
    }

    .step-hint {
      font-size: 13px;
      color: #8E8E93;
      margin-top: 2px;
    }

    /* ヒントボックス */
    .tip-box {
      background: #FFF8F0;
      border-left: 3px solid #E8692A;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      margin-top: 14px;
      font-size: 14px;
      color: #3A3A3C;
      line-height: 1.6;
    }

    .tip-box strong {
      color: #E8692A;
    }

    /* スワイプデモ */
    .swipe-demo {
      background: #F9F9F9;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      overflow: hidden;
    }

    .swipe-demo-label {
      font-size: 12px;
      font-weight: 600;
      color: #8E8E93;
      margin-bottom: 10px;
      text-align: center;
    }

    .swipe-row-container {
      position: relative;
      height: 52px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .swipe-row-container:last-child {
      margin-bottom: 0;
    }

    .swipe-delete-bg {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 80px;
      background: #FF3B30;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      border-radius: 0 10px 10px 0;
    }

    .swipe-row {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FFFFFF;
      border: 1px solid #E5E5EA;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 15px;
      color: #1C1C1E;
      animation: swipeLeft 3s ease-in-out infinite;
    }

    .swipe-row-static {
      background: #FFFFFF;
      border: 1px solid #E5E5EA;
      border-radius: 10px;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 15px;
      color: #1C1C1E;
      margin-bottom: 8px;
    }

    .swipe-row-static:last-child {
      margin-bottom: 0;
    }

    .swipe-finger {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      animation: fingerSwipe 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes swipeLeft {
      0%, 20%  { transform: translateX(0); }
      40%, 60% { transform: translateX(-80px); }
      80%, 100% { transform: translateX(0); }
    }

    @keyframes fingerSwipe {
      0%, 20%  { transform: translateY(-50%) translateX(0); opacity: 1; }
      40%, 60% { transform: translateY(-50%) translateX(-80px); opacity: 1; }
      65%      { opacity: 0; }
      80%, 100% { transform: translateY(-50%) translateX(0); opacity: 0; }
    }

    /* 多言語切替 */

    /* フッター */
    footer {
      text-align: center;
      padding: 8px 20px 48px;
      font-size: 13px;
      color: #8E8E93;
    }

    footer a {
      color: #E8692A;
      text-decoration: none;
    }
  </style>
</head>
